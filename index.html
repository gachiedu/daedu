        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    <script>
        // --- 전역 설정 ---
        const SHEET_ID = '1L86irzJORFB8CndJ9osI471Dcts3HwM5Zp_7BNqk40M';
        let adminAuthCode = '';
        let activeCategories = []; // 동적 카테고리 저장 배열
        const sheetLink = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;

        // --- 다크모드 로직 ---
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').classList.replace('fa-moon', 'fa-sun');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').classList.replace('fa-sun', 'fa-moon');
            }
        }
        
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
                icon.classList.replace('fa-sun', 'fa-moon');
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
                icon.classList.replace('fa-moon', 'fa-sun');
            }
        }
        
        initTheme(); // 스크립트 로드 시 즉시 실행

        // --- 탭 전환 로직 ---
        function switchTab(tabIdx) {
            // 모든 탭 스타일 초기화
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                // 배지 색상 초기화
                const badge = btn.querySelector('.session-badge');
                if(badge) {
                    badge.className = 'text-xs font-bold px-2 py-0.5 rounded mr-2 session-badge bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-300';
                }
            });
            
            // 활성화 탭 스타일 적용
            const activeBtn = document.getElementById(`tab-${tabIdx}`);
            if(activeBtn) {
                activeBtn.classList.add('active');
                const activeBadge = activeBtn.querySelector('.session-badge');
                if(activeBadge) {
                    activeBadge.className = 'text-xs font-bold px-2 py-0.5 rounded mr-2 session-badge bg-blue-600 text-white dark:bg-blue-600 dark:text-white';
                }
            }
            
            // 섹션 전환
            document.querySelectorAll('main section').forEach(sec => {
                sec.classList.add('hidden');
                sec.classList.remove('fade-in');
            });
            const targetSec = document.getElementById(`section-${tabIdx}`);
            if(targetSec) {
                targetSec.classList.remove('hidden');
                // 리플로우 유도 후 애니메이션 클래스 추가 (부드러운 전환)
                void targetSec.offsetWidth; 
                targetSec.classList.add('fade-in');
            }
        }

        // --- 데이터 Fetch 공통 함수 ---
        async function fetchSheetData(sheetName) {
            // headers=0을 추가하여 데이터의 1행이 무조건 index 0(배열의 첫번째)으로 들어오도록 보장합니다.
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=0&sheet=${encodeURIComponent(sheetName)}`;
            try {
                const response = await fetch(url);
                const text = await response.text();
                const jsonText = text.substring(47).slice(0, -2); // 구글 API JSON 감싸기 제거
                const data = JSON.parse(jsonText);
                return data.table.rows;
            } catch (error) {
                console.error(`[${sheetName}] 데이터 로드 실패:`, error);
                return null;
            }
        }

        // 설정 로드
        async function loadSettings() {
            const rows = await fetchSheetData('설정');
            activeCategories = []; // 초기화

            if (rows && rows.length > 1) { // 1행(헤더), 2행(실제 데이터)
                try {
                    const rowData = rows[1].c; // index 1이 2행을 의미합니다.
                    adminAuthCode = (rowData[0] && rowData[0].v) ? rowData[0].v.toString() : ''; 
                    const orgName = (rowData[1] && rowData[1].v) ? rowData[1].v : '가치있는 미래교육 연구소'; 
                    const topic = (rowData[2] && rowData[2].v) ? rowData[2].v : '디지털새싹 AI 특화과정'; 

                    document.getElementById('orgName').innerText = orgName;
                    document.getElementById('courseTopic').innerText = topic;
                    document.title = `${topic} - 대시보드`;
                } catch(e) {
                    console.log("설정(기본 정보) 파싱 오류", e);
                }

                // E열(인덱스 4: 카테고리명), F열(인덱스 5: 노출여부 체크박스) 처리
                for (let i = 1; i < rows.length; i++) {
                    if (!rows[i] || !rows[i].c) continue;
                    const cols = rows[i].c;
                    const catName = (cols[4] && cols[4].v) ? cols[4].v.toString().trim() : '';
                    let isVisible = false;
                    
                    if (cols[5] && cols[5].v != null) {
                        const val = cols[5].v.toString().toUpperCase();
                        // 구글 시트 체크박스는 주로 true/false 또는 TRUE/FALSE/1/YES로 넘어옴
                        if (val === 'TRUE' || val === '1' || val === 'YES' || cols[5].v === true) {
                            isVisible = true;
                        }
                    }

                    // 카테고리명이 있고 노출에 체크된 항목만 배열에 추가
                    if (catName && isVisible) {
                        activeCategories.push(catName);
                    }
                }
            }
            return activeCategories;
        }

        function createCopyTextHTML(title, text) {
            // 이스케이프 처리 (줄바꿈, 따옴표 등)
            const safeText = text.replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/`/g, '\\`');
            return `
                <div class="bg-slate-50 dark:bg-slate-800/50 rounded-xl p-3 md:p-4 border border-slate-200 dark:border-darkborder shadow-sm flex flex-col gap-3 transition-all hover:shadow-md">

                        </div>
                        <button onclick="copyToClipboard(this, '${safeText}')" class="flex-shrink-0 px-3 py-1.5 md:px-4 md:py-2 bg-white dark:bg-darkcard hover:bg-blue-50 dark:hover:bg-blue-900/30 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-darkborder rounded-lg text-xs md:text-sm font-bold transition-colors flex items-center">

                        ${text}
                    </div>
                </div>
            `;
        }

        function copyToClipboard(btnElement, text) {
            const formattedText = text.replace(/\\n/g, '\n'); // 줄바꿈 복원
            const textarea = document.createElement('textarea');
            textarea.value = formattedText;
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                const originalHtml = btnElement.innerHTML;
                const originalClasses = btnElement.className;
                
                // 성공 시 버튼 스타일 및 텍스트 변경
                btnElement.innerHTML = '<i class="fa-solid fa-check mr-1.5"></i> <span>복사됨</span>';
                btnElement.className = "flex-shrink-0 px-3 py-1.5 md:px-4 md:py-2 bg-blue-600 text-white border border-blue-600 rounded-lg text-xs md:text-sm font-bold transition-colors flex items-center";
                
                // 2초 후 원래대로 복구
                setTimeout(() => {
                    btnElement.innerHTML = originalHtml;
                    btnElement.className = originalClasses;
                }, 2000);
            } catch (err) {
                console.error('복사 실패', err);
            } finally {
                document.body.removeChild(textarea);
            }
        }

        // 차시(카테고리) 데이터 로드
        async function loadSessionData(sheetName, idx) {
            const rows = await fetchSheetData(sheetName);
            const gridContainer = document.getElementById(`grid-${idx}`);
            if (!gridContainer) return;

            gridContainer.innerHTML = ''; 

            if (!rows || rows.length <= 1) {
                gridContainer.innerHTML = `<div class="p-6 text-center text-slate-400 dark:text-slate-500 bg-white dark:bg-darkcard rounded-xl border border-slate-200 dark:border-darkborder text-sm">등록된 실습 자료가 없습니다.</div>`;
                return;
            }

            let hasData = false;
            for (let i = 1; i < rows.length; i++) { // index 1부터 시작 (1행 헤더 제외)
                if (!rows[i] || !rows[i].c) continue;
                
                const cols = rows[i].c;
                const title = (cols[0] && cols[0].v) ? cols[0].v : '제목 없음';
                const url = (cols[1] && cols[1].v) ? cols[1].v : '#';
                
                if (!title || title === '제목 없음' || !url || url === '#') continue;
                
                const urlStr = url.toString().trim();
                const isUrl = urlStr.startsWith('http://') || urlStr.startsWith('https://');

                if (isUrl) {
                    let isDownload = false;
                    if (cols[2] && cols[2].v) {
                        const val = cols[2].v.toString().toLowerCase();
                        if (val === 'true' || val === '1') isDownload = true;
                    }
                    gridContainer.innerHTML += createResourceListHTML(title, urlStr, isDownload);
                } else {
                    // 링크가 아닌 일반 텍스트인 경우 복사 전용 UI 렌더링
                    gridContainer.innerHTML += createCopyTextHTML(title, urlStr);
                }
                
                hasData = true;
            }

            if(!hasData) {
                 gridContainer.innerHTML = `<div class="p-6 text-center text-slate-400 dark:text-slate-500 bg-white dark:bg-darkcard rounded-xl border border-slate-200 dark:border-darkborder text-sm">실습 자료가 준비중입니다.</div>`;
            }
        }

        // 초기화

                // 3. 공지/참고 및 활성화된 카테고리 시트 데이터 동시 로드
                const promises = [
                    loadNotices(),
                    loadReferences()
                ];

                categories.forEach((catName, idx) => {
                    promises.push(loadSessionData(catName, idx)); // 시트명으로 카테고리명 전달
                });

                const results = await Promise.all(promises);
                const noticeCount = results[0];
                const refCount = results[1];
                
                // 공지와 참고자료 바 표시 제어
                const subMenuBar = document.getElementById('subMenuBar');
                const separator = document.getElementById('subBarSeparator');
                
                if (noticeCount > 0 || refCount > 0) {
                    subMenuBar.style.display = 'block';
                    if (noticeCount > 0 && refCount > 0) {
                        separator.style.display = 'block';
                        separator.classList.replace('hidden', 'sm:block');
                    } else {
                        separator.style.display = 'none';
                        separator.classList.replace('sm:block', 'hidden');
                    }
                }
                
                document.getElementById('loadingIndicator').classList.add('hidden');
                document.getElementById('contentContainer').classList.remove('hidden');
                
            } catch (error) {
                console.error("초기화 에러:", error);
                document.getElementById('loadingIndicator').innerHTML = `
                    <div class="text-red-500 text-center bg-red-50 dark:bg-red-900/20 p-6 rounded-xl">
                        <i class="fa-solid fa-triangle-exclamation text-4xl mb-3"></i>
                        <p class="font-bold text-lg">데이터 연결 실패</p>
                        <p class="text-sm mt-2 text-slate-600 dark:text-slate-400">구글 시트의 접근 권한('링크가 있는 모든 사용자')을 확인해주세요.</p>
                    </div>
                `;
            }
        }

        // 모달 제어 함수들
        function openQrModal(imgSrc, title, link) {
            document.getElementById('qrModalImg').src = imgSrc;
            document.getElementById('qrModalTitle').innerText = title;
            document.getElementById('qrModalLink').href = link;
            document.getElementById('qrModal').classList.remove('hidden');
        }
        function closeQrModal() { document.getElementById('qrModal').classList.add('hidden'); }

        function openAdminModal() {
            document.getElementById('adminPassword').value = '';
            document.getElementById('adminErrorMsg').classList.add('hidden');
            document.getElementById('adminModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('adminPassword').focus(), 100);
        }
        function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }

        function checkAdminPassword() {
            const inputVal = document.getElementById('adminPassword').value;
            if (inputVal.toString() === adminAuthCode.toString() || adminAuthCode === '') {
                closeAdminModal();
                showMsgModal(
                    "관리자 인증 성공", 
                    "구글 스프레드시트로 이동하여 데이터를 편집합니다.<br>수정 후 이 화면을 <b>새로고침</b>하면 내용이 반영됩니다.", 
                    "success", 
                    () => window.open(sheetLink, '_blank')
                );
            } else {
                document.getElementById('adminErrorMsg').classList.remove('hidden');
            }
        }

        function showMsgModal(title, text, type = 'info', callback = null) {
            document.getElementById('msgTitle').innerHTML = title;
            document.getElementById('msgText').innerHTML = text;
            
            const iconDiv = document.getElementById('msgIcon');
            if(type === 'success') {
                iconDiv.className = "mb-4 text-5xl text-emerald-500";
                iconDiv.innerHTML = '<i class="fa-regular fa-circle-check"></i>';
            } else {
                iconDiv.className = "mb-4 text-5xl text-blue-500";
                iconDiv.innerHTML = '<i class="fa-solid fa-circle-info"></i>';
            }

            document.getElementById('msgModal').classList.remove('hidden');
            
            document.getElementById('msgModal').onclick = function(e) {
                if(e.target === this || e.target.tagName === 'BUTTON') {
                    closeMsgModal();
                    if(callback) callback();
                    document.getElementById('msgModal').onclick = null;
                }
            }
        }
        function closeMsgModal() { document.getElementById('msgModal').classList.add('hidden'); }

        // 이벤트 리스너
        document.getElementById('adminPassword').addEventListener('keypress', e => { if(e.key === 'Enter') checkAdminPassword(); });
        document.addEventListener('keydown', e => {
            if(e.key === 'Escape') { closeQrModal(); closeAdminModal(); closeMsgModal(); }
        });

        // 페이지 시작
        window.onload = initializeDashboard;
    </script>
</body>
</html>
